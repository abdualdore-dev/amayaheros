<style>
:root{--ink:#111827;--mut:#6B7280;--line:#E5E7EB;--soft:#F9FAFB}
*{-webkit-tap-highlight-color:transparent}
body{background:#fff;color:var(--ink);font-family:'Segoe UI','Noto Sans Arabic',Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.55}
.font-black{font-weight:700!important}.font-bold{font-weight:600!important}
.nb{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(17,24,39,.04)}
.pk,.or,.gr{background:var(--soft)}.bl,.pu,.ye{background:#F3F4F6}
.nb.rd{background:#FEF2F2;border-color:#FECACA}
.btn{border:1px solid var(--ink);border-radius:8px;padding:.5rem 1rem;font-weight:600;cursor:pointer;transition:.15s;background:var(--ink);color:#fff;font-size:.9rem}
.btn:hover{background:#374151;border-color:#374151}.btn:active{transform:scale(.98)}
.btn.pk,.btn.bl,.btn.or,.btn.pu,.btn.bg-white{background:#fff!important;color:var(--ink);border-color:#D1D5DB}
.btn.pk:hover,.btn.bl:hover,.btn.or:hover,.btn.pu:hover,.btn.bg-white:hover{background:#F3F4F6!important}
.btn.gr,.btn.ye{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.rd{background:#fff!important;color:#B91C1C;border-color:#FCA5A5}
.btn.rd:hover{background:#FEF2F2!important}
.inp{border:1px solid #D1D5DB;border-radius:8px;padding:.5rem .75rem;width:100%;background:#fff;font-size:.92rem}
.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,24,39,.08)}
.inp:disabled{background:#F3F4F6;color:var(--mut)}
@keyframes pulseRed{0%,100%{background:#FEE2E2;box-shadow:0 0 0 0 rgba(220,38,38,.35)}50%{background:#FECACA;box-shadow:0 0 14px 4px rgba(220,38,38,.3)}}
.alert{animation:pulseRed 1s infinite;border-color:#DC2626}
.nav{display:block;padding:.5rem .8rem;border-radius:8px;font-weight:600;color:#374151;cursor:pointer;font-size:.92rem;white-space:nowrap}
.nav:hover{background:#F3F4F6}.nav.on{background:var(--ink);color:#fff}
.navg{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--mut);margin:1rem .8rem .3rem;text-transform:uppercase}
[style*="height:14px"]{background:var(--ink)!important}.rd[style*="height:14px"]{background:#B91C1C!important}
#toast{background:var(--ink)!important;color:#fff;border-color:var(--ink)}
h1,h2,h3{letter-spacing:-.01em}
html{font-size:clamp(14px,.55vw + 10px,24px)}
body{padding:0;margin:0}
.login-wrap{max-width:30rem;margin:0 auto;padding:1.5rem 1rem}
.shell{display:flex;min-height:100vh}
.side{display:none;width:15.5rem;flex-shrink:0;background:#0B0B0C;color:#D4D4D8;position:sticky;top:0;height:100vh;overflow:auto;padding:1.1rem .75rem}
.side .nav{color:#9fa2a4}.side .nav:hover{background:#18181B;color:#fff}.side .nav.on{background:#fff;color:#0B0B0C}
.side .navg{color:#6f7274}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid #E5E7EB;padding:.7rem 1rem;padding-top:calc(.7rem + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.content{padding:1rem 1rem 6.5rem}
.bottom{position:fixed;bottom:0;inset-inline:0;background:#0B0B0C;display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom a{flex:1;text-align:center;padding:.85rem .2rem;color:#9fa2a4;font-size:.78rem;font-weight:600;cursor:pointer}
.bottom a.on{color:#fff;box-shadow:inset 0 3px 0 #fff}
.sheet{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.5)}
.sheet>div{position:absolute;bottom:0;inset-inline:0;background:#fff;border-radius:16px 16px 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
#toast{bottom:5.5rem!important}
@media(min-width:768px){.side{display:block}.bottom{display:none}.content{padding:1.5rem 2rem 2.5rem}#toast{bottom:1.5rem!important}}
@media(min-width:1536px){.md\:grid-cols-2{grid-template-columns:repeat(3,minmax(0,1fr))}.lg\:grid-cols-3{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:2200px){.md\:grid-cols-2{grid-template-columns:repeat(4,minmax(0,1fr))}}

:root{color-scheme:light}
html,body,.shell,.main-col,.content{background:#fff;color:var(--ink)}
body{font-variant-numeric:tabular-nums}
input[type=date].inp,input[type=time].inp{min-width:0;-webkit-appearance:none;appearance:none;height:2.5rem;background:#fff}
.brand{width:2.4rem;height:2.4rem;border-radius:.6rem;background:#fff;color:#0B0B0C;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em}

.pill.ok{background:#E8F5EC;color:#166534}.pill.warn{background:#FEF3C7;color:#92400E}.pill.bad{background:#FEE2E2;color:#991B1B}

.sheet.center{display:flex;align-items:center;justify-content:center;padding:1rem}
.sheet.center>.dlg{position:relative;inset:auto;bottom:auto;border-radius:14px;width:min(92vw,26rem);max-height:85vh;overflow:auto;background:#fff;padding:1.25rem}

html{font-size:13px}
.side{display:block;width:10.5rem;height:100vh;height:100dvh;padding:.55rem .4rem}

.topbar{position:static;padding:.35rem .75rem}

.btn{padding:.35rem .7rem}.inp{padding:.35rem .6rem}

}

 else if(S.mgrs.find(m=>m.user===u&&m.pass===p)){const mm=S.mgrs.find(m=>m.user===u&&m.pass===p);S.session=mm.admin?{role:'owner',id:mm.id}:{role:'mgr',id:mm.id};tab='dash'}else{const r=S.runners.find(r=>r.user===u&&r.pass===p&&!r.off);if(r){S.session={role:'runner',id:r.id};tab='me'}else{loginErr=true;return render()}}

/* ---------- Breaks ---------- */
function startBreak(id){
 const m=parseInt(document.getElementById('m_'+id).value);if(!m||m<1)return toast(T('اكتب عدد الدقائق','Enter the minutes',"Dakika sayısını girin"));
 S.breaks[id]={start:Date.now(),mins:m};save();render();
}
function endBreak(id){
 const b=S.breaks[id],r=S.runners.find(x=>x.id===id);
 if(b){const over=Date.now()-(b.start+b.mins*60000);
  if(over>0&&r)S.delays.unshift({name:r.name,char:r.char,late:Math.ceil(over/60000),at:Date.now()});
  if(r)S.blog.push({rid:id,name:r.name,char:r.char,mins:b.mins,...brCalc(b,Date.now()),at:Date.now()})}
 delete S.breaks[id];save();render();
}
function tick(){
 const now=Date.now();
 document.querySelectorAll('[data-end]').forEach(el=>{
  const d=+el.dataset.end-now,id=el.dataset.id,card=document.getElementById('c_'+id),lb=document.getElementById('l_'+id);
  const f=ms=>{const s=Math.floor(Math.abs(ms)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  if(d>=0){el.textContent=f(d);if(lb)lb.textContent=t('left');card&&card.classList.remove('alert');delete ALR[id];if(d<60000&&!WRN[id]){WRN[id]=1;beep(1)}}
  else{el.textContent='+'+f(d);if(lb)lb.textContent=' '+t('late')+' '+Math.ceil(-d/60000)+' '+t('lateMin');card&&card.classList.add('alert');if(!ALR[id]){ALR[id]=1;beep();try{if(isStaff()&&window.Notification&&Notification.permission==='granted')new Notification('Amaya Heroes',{body:nm(id)+' - '+t('late')})}catch(e){}}}
 });
}
setInterval(tick,1000);

function onPhoto(inp){
 const f=inp.files[0];if(!f)return;
 const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  pendingPhoto=c.toDataURL('image/jpeg',.7);const pv=document.getElementById('pv');pv.src=pendingPhoto;pv.classList.remove('hidden')};im.src=e.target.result};
 rd.readAsDataURL(f);
}
function addBroken(){
 const idx=+document.getElementById('bi').value,q=parseInt(document.getElementById('bq').value)||1;
 const other=document.getElementById('bo').value.trim(),who=document.getElementById('bw').value,note=document.getElementById('bn').value.trim();
 if(idx===4&&!other)return toast(' '+t('other'));
 S.broken.unshift({id:'b'+Date.now(),item:idx,other,qty:q,who,note,photo:pendingPhoto,at:Date.now()});
 pendingPhoto='';save();render();
}
function showImg(id){const b=S.broken.find(x=>x.id===id);if(!b||!b.photo)return;document.getElementById('modalImg').src=b.photo;document.getElementById('modal').classList.remove('hidden')}

const whoName=b=>{const r=S.runners.find(x=>x.id===b.who);return r?r.name:'-'};

const fileTag=r=>String((r&&r.user)||'').replace(/[^A-Za-z0-9_-]/g,'')||String((r&&r.id)||'x').replace(/[^A-Za-z0-9_-]/g,'');
const safeFile=n=>{n=String(n||'amaya.xlsx');const m=/(\.[A-Za-z0-9]+)$/.exec(n),ext=m?m[1]:'',base=(ext?n.slice(0,-ext.length):n).replace(/[^A-Za-z0-9_.-]+/g,'-').replace(/-{2,}/g,'-').replace(/^-|-$/g,'')||'amaya';return base+ext};
async function saveFile(name,blob){name=safeFile(name);try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data:blob});return}}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function exportXlsx(){
 try{await loadExcel()}catch(e){return toast('ExcelJS load failed')}
 try{
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Breakage',{views:[{rightToLeft:S.lang==='ar'}]});
  const H=S.lang==='ar'?['#','الصنف','العدد','الرنر','ملاحظة','التاريخ والوقت','الصورة']:S.lang==='tr'?['#','Ürün','Adet','Komi','Not','Tarih ve saat','Fotoğraf']:['#','Item','Qty','Runner','Note','Date & Time','Photo'];
  ws.columns=[{width:6},{width:24},{width:8},{width:18},{width:30},{width:24},{width:18}];
  const hr=ws.addRow(H);hr.eachCell(c=>{c.font={bold:true};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFD93D'}};c.border={top:{style:'medium'},bottom:{style:'medium'},left:{style:'medium'},right:{style:'medium'}};c.alignment={horizontal:'center'}});
  S.broken.forEach((b,i)=>{
   const r=ws.addRow([i+1,itemName(b),b.qty,whoName(b),b.note,fmt(b.at),b.photo?'':'-']);
   r.alignment={vertical:'middle',horizontal:'center',wrapText:true};
   if(b.photo){r.height=75;const id=wb.addImage({base64:b.photo,extension:'jpeg'});ws.addImage(id,{tl:{col:6.1,row:i+1.1},ext:{width:90,height:90}})}
  });
  const buf=await wb.xlsx.writeBuffer();await saveFile('amaya-breakage-'+new Date().toISOString().slice(0,10)+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));toast(' Excel');
 }catch(e){toast(' '+e.message)}
}

const atFrom=v=>{if(!v)return Date.now();const [h,m]=v.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d.getTime()};
const SHH=()=>{const v=S.cfg&&S.cfg.shiftHours;return v===undefined||v===''||isNaN(+v)?10:+v};
const LTRIG=()=>{const v=S.cfg&&S.cfg.lateTrig;return v===undefined||v===''||isNaN(+v)?10:+v};
const LPEN=()=>{const v=S.cfg&&S.cfg.latePen;return v===undefined||v===''||isNaN(+v)?30:+v};
function dutyOf(a){if(!a)return null;const base=SHH()*60,pen=a.pen||0,req=base+pen;return{base,pen,req,end:a.at+req*6e4}}
const hhmm=mins=>{mins=Math.max(0,Math.round(mins));const h=Math.floor(mins/60),m=mins%60;return h+':'+String(m).padStart(2,'0')};
function staffIn(id,tv){if(!isStaff())return;const el=document.getElementById('ti_'+id),at=atFrom(tv||(el&&el.value)),sh=S.shifts.find(x=>x.id===todaySh(id)),f=sh?tm(sh.from):null,rawLate=f!==null?Math.max(0,minOf(at)-f):0,late=f!==null&&minOf(at)-f>grace()?minOf(at)-f:0,pen=rawLate>=LTRIG()?LPEN():0;
 S.att.push({id:'a'+Date.now(),rid:id,at,out:0,late,rawLate,pen,sh:sh?sh.id:'',by:meName()});logAct('check-in '+nm(id)+(late?' late '+late:'')+(pen?' pen '+pen:''));

function attCard(id){if(activeAtt(id))return shiftCard(id);const a=attDay(id,day0()).pop(),dn=new Date().getDay(),sc=S.sched[id]||{},sh=S.shifts.find(x=>x.id===sc[dn]);

 ['dash',/(لوحه التحكم|الرئيسيه|dashboard|home)/,'لوحة التحكم: نظرة سريعة على اليوم — من الحاضر ومن المتأخر ومن الغائب، والاستراحات الجارية، وعدادات نهاية الدوام، والتنبيهات المهمة.','Dashboard: today at a glance — who is present, late or missing, running breaks, shift countdowns and important alerts.','Kontrol paneli: günün özeti — kim geldi, kim geç kaldı, kim gelmedi; devam eden molalar, vardiya bitiş sayaçları ve önemli uyarılar.'],
 ['ai',/(المساعد|الذكاء|assistant|\bai\b)/,'المساعد: اسأله أي سؤال عن أي شخص أو قسم أو فترة، فيُعدّ التقارير وملفات Excel، ويفهم الأوامر (خصم نقاط، استراحة، حضور، إنذار، غياب، رسالة، اجتماع، توزيع طاولات، سعر، طبق بالخطأ، شكوى، مدح) ويعرض لك الخطوات قبل التنفيذ. ويمكنك رفع صورة الجدول الأسبوعي ليوزعه في النظام. الأسئلة الحرة تحتاج تفعيل المساعد من الإعدادات.','Assistant: ask anything about any person, section or period; it makes reports and Excel files and runs orders after you confirm. It can also read a weekly schedule photo. Free-form questions need the assistant enabled in Settings.','Asistan: herhangi bir kişi, bölüm veya dönem hakkında soru sorun; rapor ve Excel dosyaları hazırlar, komutları anlar ve uygulamadan önce adımları size gösterir. Haftalık çizelgenin fotoğrafını da okuyup sisteme dağıtabilir. Serbest sorular için Ayarlar’dan asistanyı etkinleştirin.'],
 ['notes',/(اشعار|اشعارات|رساله|رسائل|ابعث|notification|message)/,'الإشعارات: كل التنبيهات والرسائل. يمكنك منها إرسال رسالة لشخص أو للقسم كله أو للجميع: تختار المرسل إليه والنوع، وتكتب العنوان والنص، ثم تضغط إرسال. يصل الإشعار إلى هاتف الموظف.','Notifications: all alerts and messages. Send a message to a person, a department or everyone: pick the recipient and type, write the title and text, then Send.','Bildirimler: tüm uyarılar ve mesajlar. Bir kişiye, bir bölüme veya herkese mesaj gönderin: alıcıyı ve türü seçin, başlığı ve metni yazın, Gönder’e basın. Bildirim personelin telefonuna ulaşır.'],
 ['breaks',/(استراح|break)/,'الاستراحات: تبدأ استراحة لأي شخص بعدد من الدقائق، ويظهر عداد تنازلي. إذا تأخر عن الاستراحة يُسجَّل التأخير بالدقائق. ومن الصفحة نفسها تنهي الاستراحة.','Breaks: start a break for anyone with minutes; a countdown runs. Coming back late records break lateness. End the break from the same page.','Molalar: herhangi biri için dakika belirterek mola başlatın; geri sayım çalışır. Geç dönerse gecikme dakika olarak kaydedilir. Molayı aynı sayfadan bitirin.'],
 ['shifts',/(شفت|شفتات|جدول|دوام|shift|schedule)/,'الشفتات والجدول: تعرّف الشفتات (الاسم ووقت البداية والنهاية) وتوزع جدول الأسبوع لكل شخص (شفت أو إجازة لكل يوم). ومن هنا تسجل الحضور والانصراف. الدوام 10 ساعات من وقت الحضور، والتأخير فوق الحد يُضاف إليه وقت عقوبة.','Shifts & schedule: define shifts and set each person\'s weekly schedule (shift or day off). Check-in/out happens here. The shift is 10 hours from check-in; lateness past the limit adds penalty time.','Vardiyalar ve program: vardiyaları tanımlayın (ad, başlangıç ve bitiş saati) ve herkesin haftalık programını belirleyin (her gün için vardiya veya izin). Giriş ve çıkış buradan kaydedilir. Vardiya girişten itibaren 10 saattir; sınırı aşan gecikmeye ceza süresi eklenir.'],
 ['assign',/(توزيع الرنر|توزيع الرنرات|assign)/,'توزيع الرنرات: توزع الرنرات على الأقسام والطاولات للشفت.','Runner assignments: assign runners to sections/tables for the shift.','Komi dağıtımı: vardiya için komileri bölümlere ve masalara dağıtın.'],
 ['check',/(فحص|check)/,'فحص الشفت: قائمة فحص لكل شخص (الزي، الحلاقة، النظافة...)، تحدد كل بند صحيحاً أو خطأ، وتُحفظ النتيجة مع البنود الخاطئة.','Shift check: a checklist per person (uniform, grooming, hygiene...); mark each item right or wrong and the result is saved with the failed items.','Vardiya kontrolü: her kişi için kontrol listesi (üniforma, tıraş, temizlik...); her maddeyi doğru veya yanlış işaretleyin, sonuç eksik maddelerle birlikte kaydedilir.'],
 ['menu',/(منيو|المنيو|menu|سعر|اسعار|اختبار|امتحان|quiz)/,'المنيو: منيو المطعم الرسمي بأقسامه (أكل، مشروبات، شيشة، فطور) مع الأسعار والصور والمكونات. يعدّل المدير السعر فقط من زر تعديل السعر بجانب الطبق، ويمكنه إرجاع السعر الأصلي. وفيه اختبار منيو للكادر: أول محاولة في اليوم بنتيجة 80% أو أكثر تمنح نقطة.','Menu: the official menu by section with prices, photos and allergens. Managers edit prices only (and can restore the original). Includes a staff menu quiz: first daily attempt at 80%+ earns a point.','Menü: bölümleriyle resmi restoran menüsü (yemek, içecek, nargile, kahvaltı); fiyatlar, fotoğraflar ve içeriklerle. Yönetici yalnızca fiyatı, yemeğin yanındaki fiyat düzenleme düğmesinden değiştirir ve orijinal fiyata dönebilir. Personel için menü sınavı da vardır: günün ilk denemesinde %80 veya üzeri bir puan kazandırır.'],
 ['meetings',/(اجتماع|meeting)/,'الاجتماعات: تنشئ اجتماعاً بعنوان ويوم وساعة ومكان ومدة، لقسم واحد أو أكثر أو للجميع. يصل إشعار للموظفين فيؤكدون الحضور أو يعتذرون، ويصلهم تذكير قبل الموعد. بعد الاجتماع تسجل من حضر ومن غاب، ويمكنك إلغاؤه.','Meetings: create a meeting (title, day, time, place, duration) for one or more departments or all. Staff get notified, confirm or apologise, and get reminders. Afterwards mark attendance; you can cancel it.','Toplantılar: başlık, gün, saat, yer ve süreyle bir veya daha fazla bölüm ya da herkes için toplantı oluşturun. Personele bildirim gider; katılımı onaylar veya özür dilerler ve saatten önce hatırlatma alırlar. Toplantıdan sonra katılanları ve katılmayanları işaretleyin; toplantıyı iptal de edebilirsiniz.'],
 ['scores',/(نقاط|نقطه|points|score)/,'النقاط: رصيد نقاط كل شخص وسجلها. تُضاف نقطة للحضور في الوقت ومدح الزبون واختبار المنيو، وتُخصم عن الطبق المطلوب بالخطأ (إذا كان الخطأ منه) وغيرها. الشارات: برونزي 5، فضي 15، ذهبي 30.','Points: each person\'s balance and log. Points come from on-time arrival, guest praise and the menu quiz; deductions for own-fault wrong items and others. Badges: bronze 5, silver 15, gold 30.','Puanlar: herkesin puan bakiyesi ve kaydı. Zamanında geliş, misafir övgüsü ve menü sınavı puan kazandırır; kendi hatasından kaynaklanan yanlış sipariş ve benzerleri puan düşürür. Rozetler: bronz 5, gümüş 15, altın 30.'],
 ['stats',/(احصائيات|احصاء|stats)/,'الإحصائيات: أرقام وتحليلات للقسم على فترة (تأخير، استراحات، نقاط...).','Stats: numbers and analysis for the section over a period.','İstatistikler: bir dönem için bölümün sayıları ve analizleri (gecikme, molalar, puanlar...).'],
 ['report',/(تقرير اليوم|daily report)/,'تقرير اليوم: ملخص يوم كامل للقسم.','Daily report: a full-day summary for the section.','Günün raporu: bölüm için tam günün özeti.'],
 ['daily',/(التقرير اليومي|يومي|غياب|absent)/,'التقرير اليومي: تختار يوماً وترى كل شخص: حضوره وتأخيره وغيابه. ومن هنا تسجل الغياب مع السبب أو تلغيه.','Daily report: pick a day and see each person\'s attendance, lateness and absence. Record or undo an absence with a reason here.','Günlük rapor: bir gün seçip herkesin devamını, gecikmesini ve devamsızlığını görün. Devamsızlığı nedeniyle buradan kaydedin veya geri alın.'],
 ['warns',/(انذار|انذارات|warning)/,'الإنذارات: تسجل إنذاراً شفهياً أو كتابياً أو نهائياً لأي شخص مع السبب. يصله إشعار، والإنذار النهائي يصل للإدارة. المالك فقط يحذف الإنذار.','Warnings: record a verbal, written or final warning with a reason. The person is notified; a final warning also alerts management. Only the owner can delete one.','Uyarılar: herhangi birine nedeniyle birlikte sözlü, yazılı veya son uyarı kaydedin. Kişiye bildirim gider; son uyarı yönetime de iletilir. Uyarıyı yalnızca sahip silebilir.'],
 ['league',/(دوري الرنر|league)/,'دوري الرنرات: ترتيب الرنرات حسب الأداء والنقاط.','Runner league: runners ranked by performance and points.','Komi ligi: komilerin performans ve puana göre sıralaması.'],
 ['mreport',/(تقرير المدير|manager report)/,'تقرير المدير: تقرير شامل للمدير عن القسم على فترة.','Manager report: a full section report over a period.','Yönetici raporu: bir dönem için bölümün kapsamlı raporu.'],
 ['profile',/(الملف الشهري|ملف شهري|شهاده|profile)/,'الملف الشهري: ملف كل شخص في الشهر: حضوره وتأخيره ونقاطه وإنذاراته، مع شهادة تقدير.','Monthly file: each person\'s month — attendance, lateness, points, warnings — with a certificate.','Aylık dosya: herkesin aylık dosyası — devam, gecikme, puanlar, uyarılar — takdir belgesiyle.'],
 ['shiftcmp',/(مقارنه الشفتات|مقارنه|compare)/,'مقارنة الشفتات: تقارن أداء الشفتات ببعضها.','Shift comparison: compare shifts against each other.','Vardiya karşılaştırması: vardiyaların performansını birbiriyle karşılaştırın.'],
 ['chat',/(تواصل|دردشه|chat)/,'التواصل: محادثة داخلية بين الإدارة والكادر.','Chat: internal chat between management and staff.','Sohbet: yönetim ile personel arasında iç yazışma.'],
 ['sales',/(مبيع|انباع|sales|best)/,'الأكثر مبيعاً (الكباتن): يسجل كل كابتن في آخر اليوم أكثر طبق ومشروب ونركيلة بيعت عنده من المنيو. يرى المدير تقريراً يومياً وأسبوعياً وشهرياً مع تصدير Excel.','Best sellers (captains): each captain logs his top dish, drink and shisha at day end; managers see daily/weekly/monthly reports and Excel.','En çok satanlar (kaptanlar): her kaptan gün sonunda menüden en çok sattığı yemeği, içeceği ve nargileyi kaydeder. Yönetici günlük, haftalık ve aylık raporları Excel aktarımıyla görür.'],
 ['orders',/(حركه الطاولات|كم طاوله|طلبات الطاول|عدد الضيوف|table service)/,'حركة الطاولات (الكباتن): يفتح الكابتن الطاولة من بوابته، ويكتب عدد الأشخاص، ويختار من المنيو (المطبخ، البار) بالعدد وملاحظة لكل صنف ورسالة مع الطلب، ثم يغلق الطاولة. يرى المدير الطاولات المفتوحة مباشرة، والمتأخرة أولاً، وتفاصيل كل طاولة عند فتحها، مع عدّ تلقائي لكل كابتن وتصدير Excel. الطلب تسجيل فقط والفاتورة تبقى من الكاشير.','Table service (captains): the captain opens a table, enters guests, picks items from the menu with quantity and notes, then closes it. Managers see automatic counts per captain and Excel export. Orders are records only; billing stays on the POS.','Masa hareketi (kaptanlar): kaptan kendi ekranından masayı açar, misafir sayısını yazar, menüden (mutfak, bar) adet ve ürün notuyla seçer, siparişe mesaj ekler ve sonra masayı kapatır. Yönetici açık masaları canlı görür, gecikenler en üstte; masaya dokununca ayrıntılar açılır; her kaptan için otomatik sayım ve Excel aktarımı vardır. Sipariş yalnızca kayıttır; hesap kasadan yapılır.'],
 ['capleague',/(دوري الكباتن|كابتن الاسبوع|كابتن الشهر)/,'دوري الكباتن: ترتيب الكباتن بالأسبوع أو الشهر: النقاط ناقص ضعف الشكاوى ناقص التأخير وفحوص الشفت الخاطئة، زائد نصف نقطة لكل سجل مبيعات.','Captains league: weekly/monthly ranking — net points minus 2x complaints, lateness and failed checks, plus 0.5 per sales log.','Kaptanlar ligi: haftalık veya aylık sıralama — net puan eksi şikayetlerin iki katı, eksi gecikmeler ve eksikli kontroller, artı her satış kaydı için yarım puan.'],
 ['tables',/(طاول|صاله|صالات|vip|table|hall)/,'توزيع الطاولات (الكباتن): تختار اليوم، وتضيف الكباتن، وتكتب لكل واحد وقته (من - إلى) وطاولاته أو "كل الصالات". تضغط على الكابتن ثم على الطاولات في الصالة لتعطيه إياها، أو صفاً كاملاً أو صالة كاملة. أنت تكتب أرقام الطاولات والصالات (الرئيسية وVIP). يضغط الكابتن الجديد "استلمت" فيُسجَّل وقت الاستلام. تضغط على أي طاولة فيظهر سجلها: من استلمها ومن أي ساعة إلى أي ساعة. وفيها نسخ توزيع اليوم السابق، ومشاركة نص للمجموعة، وExcel.','Tables (captains): pick the day, add captains with their hours and tables (or all sections), tap a captain then tables/rows/halls. You type the hall table numbers. The next captain taps Taken to record the takeover time. Tap a table for its log. Copy previous day, share text, Excel.','Masa dağıtımı (kaptanlar): günü seçin, kaptanları ekleyin ve her birine saatlerini (başlangıç - bitiş) ve masalarını ya da "Tüm salonlar"ı yazın. Kaptana, ardından salondaki masalara dokunarak atayın; tüm bir sırayı veya salonu da atayabilirsiniz. Masa ve salon numaralarını (ana salon ve VIP) siz yazarsınız. Yeni kaptan "Devraldım"a basınca devralma saati kaydedilir. Bir masaya dokunursanız kaydı açılır: kim, hangi saatten hangi saate baktı. Önceki günü kopyalama, grup için metin paylaşma ve Excel vardır.'],
 ['people',/(اشخاص|موظف|موظفين|اضافه شخص|حساب|كلمه السر|people|staff|account)/,'الأشخاص (للمالك): تضيف موظفاً بالاسم واسم المستخدم وكلمة السر والقسم والراتب، وتعدّل حسابه أو توقفه.','People (owner): add staff with name, username, password, department and salary; edit or suspend.','Kişiler (sahip için): ad, kullanıcı adı, şifre, bölüm ve maaşla personel ekleyin; hesabı düzenleyin veya askıya alın.'],
 ['salary',/(راتب|رواتب|salary)/,'الرواتب (للمالك): راتب كل شخص في الشهر، ويُخصم يوم الغياب من الراتب حسب عدد أيام الشهر المحدد في الإعدادات.','Salaries (owner): monthly salary per person; each absence deducts a day based on the divisor in Settings.','Maaşlar (sahip için): herkesin aylık maaşı; her devamsızlık günü, Ayarlar’da belirlenen gün sayısına göre maaştan düşülür.'],
 ['broken',/(مكسور|كسر|broke)/,'المكسورات (الرنرات): تسجل الشيء الذي انكسر ومن كسره والعدد.','Breakage (runners): record what broke, who and how many.','Kırıklar (komiler): neyin kırıldığını, kimin kırdığını ve adedini kaydedin.'],
 ['settings',/(اعدادات|الاعدادات|مفتاح|gemini|claude|settings|(افعل|تفعيل|فعل|اشغل|تشغيل)\S* (ال)?(ذكاء|ai))/,'الإعدادات (للمالك): ساعات الدوام، ووقت السماح، وحد التأخير ودقائق العقوبة، وأيام قسمة الراتب، والمدراء وأقسامهم، وتفعيل المساعد.','Settings (owner): shift hours, grace, late limit and penalty, salary divisor, managers and their departments, and the assistant.','Ayarlar (sahip için): vardiya saatleri, tolerans süresi, gecikme sınırı ve ceza dakikaları, maaş bölme gün sayısı, yöneticiler ve bölümleri, asistan etkinleştirme.'],
 ['log',/(السجل|log|history)/,'السجل (للمالك): كل عملية تمت في النظام ومن قام بها ووقتها.','Log (owner): every action in the system, who did it and when.','Kayıt (sahip için): sistemde yapılan her işlem, kimin yaptığı ve zamanı.']];
const AIG_OK=k=>{if({people:1,salary:1,settings:1,log:1}[k])return isOwner();if({orders:1,tables:1,wrongfood:1,complaints:1,praise:1,handover:1,sales:1,capleague:1}[k])return canCap();return true};
function aiGuideText(){return AIGUIDE.filter(g=>AIG_OK(g[0])).map(g=>'- ['+g[0]+'] '+g[2]).join('\n')+'\nالأقسام: الرنرات، الكباتن، الاستقبال. المدير يتنقل بين الأقسام من فوق. الموظف يدخل بحسابه على "بوابتي": يشوف جدوله ونقاطه وإشعاراته واجتماعاته والمنيو والاختبار، والكابتن يشوف طاولاته وتسليمها ويسجل الشكاوى والمدح والمبيعات.'}
function aiHowTo(q){const n=normAr(q);if(findPeople(q).length)return null;if(!/(شلون|كيف|وين|طريقه|اشلون|منين|شنو يسوي|شنو فايده|شنو هو|شنو هي|شنو قسم|اشرح|اشرحلي|فهمني|علمني|اكدر|يكدر|how|where|what is|explain)/.test(n))return null;
 const hits=AIGUIDE.filter(g=>g[1].test(n));if(!hits.length){if(/(التطبيق|النظام|البرنامج|الاقسام|app|system)/.test(n))return {t:T('أقسام التطبيق:\n','App sections:\n',"Uygulama bölümleri:\n\n")+AIGUIDE.filter(g=>AIG_OK(g[0])).map(g=>'• '+T(g[2],g[3]).split(':')[0]).join('\n')+T("\n\nاسألني عن أي قسم، مثلاً: «كيف أوزع الطاولات» أو «ما فائدة دوري الكباتن».",'\n\nAsk me about any section, e.g. "how do I assign tables".',"\n\n\n\nHerhangi bir bölüm hakkında sorun, örneğin «masaları nasıl dağıtırım» veya «kaptanlar liginin faydası ne».")};return null}
 const g0=hits.sort((a,b)=>(n.match(b[1])||[''])[0].length-(n.match(a[1])||[''])[0].length)[0];if(!AIG_OK(g0[0]))return {t:aiNoPerm()};const g=g0;return {t:T(g[2],g[3],g[4]),go:g[0]}}
function aiGo(k){if(!AIG_OK(k))return toast(aiNoPerm());if(k==='tables'||k==='wrongfood'||k==='complaints'||k==='praise'||k==='handover'||k==='sales'||k==='capleague')DEPT=myDepts().includes('captain')?'captain':DEPT;go(k)}
function aiSmall(q){const n=normAr(q).replace(/[^\w\u0600-\u06FF ]+/g,' ').replace(/\s+/g,' ').trim(),me0=(meName()||'').split(' ')[0],H=me0?' '+me0:'';if(!n||n.split(' ').length>4)return '';
 if(/^(السلام عليكم|سلام عليكم|السلام|سلام)( .*)?$/.test(n))return T('وعليكم السلام'+H+'. اسأل أي سؤال أو أعطني أمراً.','Peace be upon you'+H+'. Ask anything or give me an order.','Aleykümselam'+H+'. Her şeyi sorabilir veya bir komut verebilirsiniz.');
 if(/^(هلو|هلا|هلاو|هلوو|اهلا|اهلين|مرحبا|مرحبه|هاي|hi|hello|hey|hala)( .*)?$/.test(n))return T('أهلاً بك'+H+'. اسأل أي سؤال، أو اطلب تقريراً، أو أعطني أمراً.','Hi'+H+'. Ask anything, request a report, or give me an order.','Merhaba'+H+'. Her şeyi sorabilir, rapor isteyebilir veya bir komut verebilirsiniz.');
 if(/^(صباح الخير|صباحو|صباح النور|good morning)/.test(n))return T('صباح النور'+H+'. كيف أستطيع مساعدتك؟','Good morning'+H+'. What can I do for you?','Günaydın'+H+'. Sizin için ne yapabilirim?');
