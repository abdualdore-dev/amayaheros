<style>
:root{--ink:#111827;--mut:#6B7280;--line:#E5E7EB;--soft:#F9FAFB}
*{-webkit-tap-highlight-color:transparent}
body{background:#fff;color:var(--ink);font-family:'Segoe UI','Noto Sans Arabic',Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.55}
.font-black{font-weight:700!important}.font-bold{font-weight:600!important}
.nb{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(17,24,39,.04)}
.pk,.or,.gr{background:var(--soft)}.bl,.pu,.ye{background:#F3F4F6}
.nb.rd{background:#FEF2F2;border-color:#FECACA}
.btn{border:1px solid var(--ink);border-radius:8px;padding:.5rem 1rem;font-weight:600;cursor:pointer;transition:.15s;background:var(--ink);color:#fff;font-size:.9rem}
.btn:hover{background:#374151;border-color:#374151}.btn:active{transform:scale(.98)}
.btn.pk,.btn.bl,.btn.or,.btn.pu,.btn.bg-white{background:#fff!important;color:var(--ink);border-color:#D1D5DB}
.btn.pk:hover,.btn.bl:hover,.btn.or:hover,.btn.pu:hover,.btn.bg-white:hover{background:#F3F4F6!important}
.btn.gr,.btn.ye{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.rd{background:#fff!important;color:#B91C1C;border-color:#FCA5A5}
.btn.rd:hover{background:#FEF2F2!important}
.inp{border:1px solid #D1D5DB;border-radius:8px;padding:.5rem .75rem;width:100%;background:#fff;font-size:.92rem}
.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,24,39,.08)}
.inp:disabled{background:#F3F4F6;color:var(--mut)}
@keyframes pulseRed{0%,100%{background:#FEE2E2;box-shadow:0 0 0 0 rgba(220,38,38,.35)}50%{background:#FECACA;box-shadow:0 0 14px 4px rgba(220,38,38,.3)}}
.alert{animation:pulseRed 1s infinite;border-color:#DC2626}
.nav{display:block;padding:.5rem .8rem;border-radius:8px;font-weight:600;color:#374151;cursor:pointer;font-size:.92rem;white-space:nowrap}
.nav:hover{background:#F3F4F6}.nav.on{background:var(--ink);color:#fff}
.navg{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--mut);margin:1rem .8rem .3rem;text-transform:uppercase}
[style*="height:14px"]{background:var(--ink)!important}.rd[style*="height:14px"]{background:#B91C1C!important}
#toast{background:var(--ink)!important;color:#fff;border-color:var(--ink)}
h1,h2,h3{letter-spacing:-.01em}
html{font-size:clamp(14px,.55vw + 10px,24px)}
body{padding:0;margin:0}
.login-wrap{max-width:30rem;margin:0 auto;padding:1.5rem 1rem}
.shell{display:flex;min-height:100vh}
.side{display:none;width:15.5rem;flex-shrink:0;background:#0B0B0C;color:#D4D4D8;position:sticky;top:0;height:100vh;overflow:auto;padding:1.1rem .75rem}
.side .nav{color:#A1A1AA}.side .nav:hover{background:#18181B;color:#fff}.side .nav.on{background:#fff;color:#0B0B0C}
.side .navg{color:#71717A}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid #E5E7EB;padding:.7rem 1rem;padding-top:calc(.7rem + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.content{padding:1rem 1rem 6.5rem}
.bottom{position:fixed;bottom:0;inset-inline:0;background:#0B0B0C;display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom a{flex:1;text-align:center;padding:.85rem .2rem;color:#A1A1AA;font-size:.78rem;font-weight:600;cursor:pointer}
.bottom a.on{color:#fff;box-shadow:inset 0 3px 0 #fff}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5)}
.sheet>div{position:absolute;bottom:0;inset-inline:0;background:#fff;border-radius:16px 16px 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
#toast{bottom:5.5rem!important}
@media(min-width:768px){.side{display:block}.bottom{display:none}.content{padding:1.5rem 2rem 2.5rem}#toast{bottom:1.5rem!important}}
@media(min-width:1536px){.md\:grid-cols-2{grid-template-columns:repeat(3,minmax(0,1fr))}.lg\:grid-cols-3{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:2200px){.md\:grid-cols-2{grid-template-columns:repeat(4,minmax(0,1fr))}}

:root{color-scheme:light}
html,body,.shell,.main-col,.content{background:#fff;color:var(--ink)}
body{font-variant-numeric:tabular-nums}
input[type=date].inp,input[type=time].inp{min-width:0;-webkit-appearance:none;appearance:none;height:2.5rem;background:#fff}
.brand{width:2.4rem;height:2.4rem;border-radius:.6rem;background:#fff;color:#0B0B0C;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em}
.usercard{margin-top:1rem;padding:.8rem .5rem 0;border-top:1px solid #27272A;color:#A1A1AA;font-size:.85rem}
.pill{display:inline-block;padding:.12rem .6rem;border-radius:999px;font-size:.78rem;font-weight:600;background:#F3F4F6;color:#374151;white-space:nowrap}
.pill.ok{background:#E8F5EC;color:#166534}.pill.warn{background:#FEF3C7;color:#92400E}.pill.bad{background:#FEE2E2;color:#991B1B}
table tbody tr:nth-child(even){background:#FAFAFA}table tbody tr:hover{background:#F3F4F6}
.sheet.center{display:flex;align-items:center;justify-content:center;padding:1rem}
.sheet.center>.dlg{position:relative;inset:auto;bottom:auto;border-radius:14px;width:min(92vw,26rem);max-height:85vh;overflow:auto;background:#fff;padding:1.25rem}
@media print{.side,.topbar,.bottom,.btn,#toast{display:none!important}.content{padding:0}}

.shell{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (orientation:landscape) and (max-height:560px){
html{font-size:13px}
.side{display:block;width:10.5rem;height:100vh;height:100dvh;padding:.55rem .4rem}
.bottom{display:none}
.topbar{position:static;padding:.35rem .75rem}
.content{padding:.75rem 1rem 1.25rem}
.btn{padding:.35rem .7rem}.inp{padding:.35rem .6rem}
.nav{padding:.36rem .6rem;font-size:.84rem}.navg{margin:.5rem .6rem .15rem}
#toast{bottom:.8rem!important}
.nb.p-4{padding:.75rem}.nb.p-6{padding:1rem}
}

iframe[src*="netlify"],
[data-netlify-drawer]{display:none!important}

 .side{padding-bottom:4.5rem}

}

/* ---------- Auth ---------- */
async function doLogin(){
 const u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value;loginErr=false;
 if(await fbSignIn(u,p)){if(sessionFromUser(u)){save();render();if(window.Notification&&Notification.permission==='granted')enablePush()}else{try{firebase.auth().signOut()}catch(e){}loginErr=true;render()}return}
 if(u==='abdurhman'&&p==='121212'){S.session={role:'owner'};tab='dash'}
 else if(S.mgrs.find(m=>m.user===u&&m.pass===p)){const mm=S.mgrs.find(m=>m.user===u&&m.pass===p);S.session=mm.admin?{role:'owner',id:mm.id}:{role:'mgr',id:mm.id};tab='dash'}else{const r=S.runners.find(r=>r.user===u&&r.pass===p&&!r.off);if(r){S.session={role:'runner',id:r.id};tab='me'}else{loginErr=true;return render()}}
 loginErr=false;save();render();
}

/* ---------- Breaks ---------- */
function startBreak(id){
 const m=parseInt(document.getElementById('m_'+id).value);if(!m||m<1)return toast(T('اكتب عدد الدقائق','Enter the minutes'));
 S.breaks[id]={start:Date.now(),mins:m};save();render();
}
function endBreak(id){
 const b=S.breaks[id],r=S.runners.find(x=>x.id===id);
 if(b){const over=Date.now()-(b.start+b.mins*60000);
  if(over>0&&r)S.delays.unshift({name:r.name,char:r.char,late:Math.ceil(over/60000),at:Date.now()});
  if(r)S.blog.push({rid:id,name:r.name,char:r.char,mins:b.mins,...brCalc(b,Date.now()),at:Date.now()})}
 delete S.breaks[id];save();render();
}
function tick(){
 const now=Date.now();
 document.querySelectorAll('[data-end]').forEach(el=>{
  const d=+el.dataset.end-now,id=el.dataset.id,card=document.getElementById('c_'+id),lb=document.getElementById('l_'+id);
  const f=ms=>{const s=Math.floor(Math.abs(ms)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  if(d>=0){el.textContent=f(d);if(lb)lb.textContent=t('left');card&&card.classList.remove('alert');delete ALR[id];if(d<60000&&!WRN[id]){WRN[id]=1;beep(1)}}
  else{el.textContent='+'+f(d);if(lb)lb.textContent=' '+t('late')+' '+Math.ceil(-d/60000)+' '+t('lateMin');card&&card.classList.add('alert');if(!ALR[id]){ALR[id]=1;beep();try{if(isStaff()&&window.Notification&&Notification.permission==='granted')new Notification('Amaya Heroes',{body:nm(id)+' - '+t('late')})}catch(e){}}}
 });
}
setInterval(tick,1000);

function onPhoto(inp){
 const f=inp.files[0];if(!f)return;
 const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  pendingPhoto=c.toDataURL('image/jpeg',.7);const pv=document.getElementById('pv');pv.src=pendingPhoto;pv.classList.remove('hidden')};im.src=e.target.result};
 rd.readAsDataURL(f);
}
function addBroken(){
 const idx=+document.getElementById('bi').value,q=parseInt(document.getElementById('bq').value)||1;
 const other=document.getElementById('bo').value.trim(),who=document.getElementById('bw').value,note=document.getElementById('bn').value.trim();
 if(idx===4&&!other)return toast(' '+t('other'));
 S.broken.unshift({id:'b'+Date.now(),item:idx,other,qty:q,who,note,photo:pendingPhoto,at:Date.now()});
 pendingPhoto='';save();render();
}
function showImg(id){const b=S.broken.find(x=>x.id===id);if(!b||!b.photo)return;document.getElementById('modalImg').src=b.photo;document.getElementById('modal').classList.remove('hidden')}
const itemName=b=>b.item===4&&b.other?b.other:L[S.lang].items[b.item];
const whoName=b=>{const r=S.runners.find(x=>x.id===b.who);return r?r.name:'-'};

const fileTag=r=>String((r&&r.user)||'').replace(/[^A-Za-z0-9_-]/g,'')||String((r&&r.id)||'x').replace(/[^A-Za-z0-9_-]/g,'');
const safeFile=n=>{n=String(n||'amaya.xlsx');const m=/(\.[A-Za-z0-9]+)$/.exec(n),ext=m?m[1]:'',base=(ext?n.slice(0,-ext.length):n).replace(/[^A-Za-z0-9_.-]+/g,'-').replace(/-{2,}/g,'-').replace(/^-|-$/g,'')||'amaya';return base+ext};
async function saveFile(name,blob){name=safeFile(name);try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data:blob});return}}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function exportXlsx(){
 try{await loadExcel()}catch(e){return toast('ExcelJS load failed')}
 try{
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Breakage',{views:[{rightToLeft:S.lang==='ar'}]});
  const H=S.lang==='ar'?['#','الصنف','العدد','الرنر','ملاحظة','التاريخ والوقت','الصورة']:['#','Item','Qty','Runner','Note','Date & Time','Photo'];
  ws.columns=[{width:6},{width:24},{width:8},{width:18},{width:30},{width:24},{width:18}];
  const hr=ws.addRow(H);hr.eachCell(c=>{c.font={bold:true};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFD93D'}};c.border={top:{style:'medium'},bottom:{style:'medium'},left:{style:'medium'},right:{style:'medium'}};c.alignment={horizontal:'center'}});
  S.broken.forEach((b,i)=>{
   const r=ws.addRow([i+1,itemName(b),b.qty,whoName(b),b.note,fmt(b.at),b.photo?'':'-']);
   r.alignment={vertical:'middle',horizontal:'center',wrapText:true};
   if(b.photo){r.height=75;const id=wb.addImage({base64:b.photo,extension:'jpeg'});ws.addImage(id,{tl:{col:6.1,row:i+1.1},ext:{width:90,height:90}})}
  });
  const buf=await wb.xlsx.writeBuffer();await saveFile('amaya-breakage-'+new Date().toISOString().slice(0,10)+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));toast(' Excel');
 }catch(e){toast(' '+e.message)}
}

const day0=()=>new Date().setHours(0,0,0,0);
function brCalc(b,end){const el=Math.max(0,end-b.start),over=el-b.mins*60000,late=over>0?Math.ceil(over/60000):0;return{used:late>0?b.mins+late:Math.round(el/60000),late}}
function stats(id){const n=Date.now(),a=S.blog.filter(x=>x.at>=day0()&&(!id||x.rid===id));let c=a.length,u=0,l=0,g=0;a.forEach(x=>{u+=x.used;l+=x.late;g+=(x.mins||0)});
 Object.keys(S.breaks).forEach(k=>{if(id&&k!==id)return;const b=S.breaks[k],x=brCalc(b,n);c++;u+=x.used;l+=x.late;g+=b.mins});return{c,u,l,g}}

 const W=900,H=300+Math.max(rows.length,1)*72+80,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
 g.fillStyle='#FFFFFF';g.fillRect(0,0,W,H);
 const box=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);g.lineWidth=2;g.strokeStyle='#CBD2DC';g.strokeRect(x,y,w,h)};
 const tx=(v,x,y,sz)=>{g.fillStyle='#000';g.font='bold '+sz+'px Segoe UI,Tahoma,sans-serif';g.textAlign='center';g.direction=ar?'rtl':'ltr';g.fillText(v,x,y)};
 box(20,20,W-46,120,'#F3F4F6');tx('Amaya Heroes - '+t('repT'),W/2,72,36);tx(new Date().toLocaleDateString(loc)+'  |  '+new Date().toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'}),W/2,115,26);
 const X=[200,470,640,790];let y=170;
 box(20,y,W-46,56,'#F9FAFB');[t('colRun'),t('colBr'),t('colUsed'),t('colLate')].forEach((h,i)=>tx(h,X[i],y+38,24));y+=76;
 if(!rows.length){box(20,y,W-46,56,'#fff');tx(t('noRep'),W/2,y+38,26);y+=76}
 const C=['#FFFFFF','#F7F9FC'];let T=[0,0,0];
 rows.forEach((x,i)=>{box(20,y,W-46,56,x.l>0?'#FCE4E4':C[i%2]);tx(x.r.name,X[0],y+38,26);tx(String(x.c),X[1],y+38,26);tx(String(x.u),X[2],y+38,26);tx(String(x.l),X[3],y+38,26);T[0]+=x.c;T[1]+=x.u;T[2]+=x.l;y+=72});
 y+=8;box(20,y,W-46,56,'#F3F4F6');tx(t('total'),X[0],y+38,26);T.forEach((v,i)=>tx(String(v),X[i+1],y+38,26));
 return cv}

function winStats(rid,a,b){const inW=ts=>ts>=a&&ts<b,dIn=d=>{const t=new Date(d+'T12:00:00').getTime();return t>=a&&t<b};
 const att=(S.att||[]).filter(x=>x.rid===rid&&inW(x.at)),late=att.filter(x=>x.late>0);
 return {att:att.length,lateN:late.length,lateMin:late.reduce((s,x)=>s+x.late,0),abs:(S.absences||[]).filter(x=>x.rid===rid&&dIn(x.day||'')).length,
  brLate:(S.blog||[]).filter(x=>x.rid===rid&&inW(x.at)).reduce((s,x)=>s+(x.late||0),0),
  bk:(S.broken||[]).filter(x=>x.who===rid&&inW(x.at)).reduce((s,x)=>s+(x.qty||1),0),
  warns:(S.warns||[]).filter(x=>x.rid===rid&&inW(x.at)).length,
  pts:(S.pts||[]).filter(x=>x.rid===rid&&inW(x.at)).reduce((s,x)=>s+x.v,0)}}
const sumStats=list=>list.reduce((o,x)=>{for(const k in x)o[k]=(o[k]||0)+x[k];return o},{});

 const best=rows[0]&&rows[0].pts>0?rows[0]:null;
 const disc=active.slice().sort((x,y)=>(x.lateMin+x.brLate+x.abs*60)-(y.lateMin+y.brLate+y.abs*60)||y.att-x.att)[0]||null;
 const zero=active.filter(x=>x.bk===0);
 return {rows,best,disc,zero}}

async function htmlToPdf(html,name,landscape){try{await loadPdfLibs()}catch(e){return toast(T('تعذّر تحميل أداة PDF، تحقق من الإنترنت','Could not load the PDF tool, check the internet'))}

 const W=landscape?1123:794,H=landscape?794:1123,box=document.createElement('div');
 box.style.cssText=`position:fixed;left:-99999px;top:0;width:${W}px;background:#ffffff;direction:${S.lang==='ar'?'rtl':'ltr'};font-family:'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif`;
 box.innerHTML=html;document.body.appendChild(box);
 try{const cv=await html2canvas(box,{scale:2,backgroundColor:'#ffffff',useCORS:true});
  const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:landscape?'landscape':'portrait',unit:'px',format:[W,H],hotfixes:['px_scaling']});
  const pageH=Math.round(H*2);let y=0,first=true;
  while(y<cv.height){const part=document.createElement('canvas');part.width=cv.width;part.height=Math.min(pageH,cv.height-y);
   const g=part.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,part.width,part.height);g.drawImage(cv,0,y,cv.width,part.height,0,0,cv.width,part.height);
   if(!first)pdf.addPage([W,H],landscape?'landscape':'portrait');pdf.addImage(part.toDataURL('image/jpeg',0.92),'JPEG',0,0,W,part.height/2);first=false;y+=pageH}
  const bl=pdf.output('blob'),f=new File([bl],name,{type:'application/pdf'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
  await saveFile(name,bl);toast(T('تم تجهيز الملف','File ready'))}
 catch(e){toast(T('خطأ في إنشاء PDF: ','PDF error: ')+(e&&e.message||e))}
 finally{box.remove()}}

/* ---------- Menu quiz ---------- */
let QZ=null;
const shuf=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function qzBuild(n){const bad=new Set(menuIssues().map(x=>x.i.id)),items=shuf(menuAll().filter(i=>!bad.has(i.id)&&!i.hide&&!i.custom&&i.g!=='breakfast'&&mPrice1(i)>0&&!(i.prices||[]).some(p=>p.v===0)));const qs=[],used=new Set();
 const nm=i=>S.lang==='ar'?i.name.ar:i.name.en,secN=i=>S.lang==='ar'?i.sec.ar:i.sec.en,ds=i=>(S.lang==='ar'?i.desc.ar||'':i.desc.en||'').trim();
 const opts=(right,pool)=>shuf([right].concat(shuf([...new Set(pool.filter(x=>x!==right))]).slice(0,3)));
 for(const i of items){if(qs.length>=n)break;if(used.has(i.id))continue;const t=qs.length%3;
  if(t===0&&i.prices.filter(p=>p.v>0).length===1){const p=mPrice1(i),pool=items.filter(x=>x.g===i.g).map(mPrice1).filter(v=>v!==p);if(new Set(pool).size<3)continue;qs.push({q:T('شكد سعر «','What is the price of “')+nm(i)+T('»؟','”?'),o:opts(iqd(p),pool.map(iqd)),a:iqd(p),id:i.id})}
  else if(t===1){const s=secN(i),pool=menuAll().filter(x=>x.g===i.g).map(secN);if(new Set(pool.filter(x=>x!==s)).size<3)continue;qs.push({q:'«'+nm(i)+T('» من أي قسم بالمنيو؟','” is in which menu section?'),o:opts(s,pool),a:s,id:i.id})}
  else{const d=ds(i);if(d.length<15||items.some(x=>x!==i&&ds(x)===d))continue;const pool=items.filter(x=>x.g===i.g&&x!==i).map(nm);qs.push({q:T('أي صنف وصفه: «','Which item is described as: “')+d+T('»؟','”?'),o:opts(nm(i),pool),a:nm(i),id:i.id})}
  used.add(i.id)}
 return qs}
function qzStart(){const qs=qzBuild(10);if(qs.length<5)return toast(T('المنيو ما بي أصناف كافية للاختبار','Not enough menu items for a quiz'));QZ={qs,i:0,pick:null,score:0,wrong:[],done:false};render()}
function qzPick(k){if(!QZ||QZ.pick!==null)return;const q=QZ.qs[QZ.i];QZ.pick=k;if(q.o[k]===q.a)QZ.score++;else QZ.wrong.push({q:q.q,a:q.a,you:q.o[k]});render()}
function qzNext(){if(!QZ)return;if(QZ.i<QZ.qs.length-1){QZ.i++;QZ.pick=null;return render()}
 QZ.done=true;const r=me();if(S.session&&S.session.role==='runner'&&r){S.quiz=S.quiz||[];S.quiz.push({id:'qz'+Date.now(),rid:r.id,at:Date.now(),day:dayKey(),score:QZ.score,total:QZ.qs.length,wrong:QZ.wrong.map(w=>w.a)});save()}render()}
function vQuiz(){const r=me(),staff=S.session&&S.session.role==='runner';
 const mine=staff&&r?(S.quiz||[]).filter(q=>q.rid===r.id).slice(-5).reverse():[];
 const today=staff&&r?(S.quiz||[]).filter(q=>q.rid===r.id&&q.day===dayKey()):[];
 if(!QZ)return `<div class="nb p-5 text-center mb-4"><div class="font-black text-lg mb-1">${T('اختبار المنيو','Menu quiz')}</div><div class="text-sm mb-3">${T('10 أسئلة من المنيو الرسمي: الأسعار والأقسام والمكونات. ','10 questions from the official menu: prices, sections and ingredients. ')}${staff?T('أول محاولة باليوم إذا جبت 8 من 10 أو أكثر تنضافلك نقطة.','Your first attempt each day earns a point if you score 8/10 or more.'):''}</div>${staff&&today.length?`<div class="text-sm mb-3 font-semibold">${T('محاولاتك اليوم: ','Your attempts today: ')+today.length+T(' — أول محاولة: ',' — first attempt: ')+today[0].score+'/'+today[0].total}</div>`:''}<button class="btn" onclick="qzStart()">${T('ابدأ الاختبار','Start the quiz')}</button></div>`+(mine.length?`<div class="nb p-4"><h3 class="font-bold mb-2">${T('آخر نتائجك','Your last results')}</h3>${mine.map(q=>`<div class="flex justify-between py-1 border-b border-gray-100"><span>${fmt(q.at)}</span><b>${q.score}/${q.total}</b></div>`).join('')}</div>`:'');
 if(QZ.done){const p=Math.round(QZ.score/QZ.qs.length*100);return `<div class="nb ${p>=80?'gr':p>=50?'ye':'rd'} p-5 text-center mb-4"><div class="text-5xl font-black mb-1">${QZ.score}/${QZ.qs.length}</div><div class="font-bold">${p>=80?T('ممتاز!','Excellent!'):p>=50?T('زين، راجع الأخطاء','Good, review your mistakes'):T('تحتاج تراجع المنيو','You need to review the menu')}</div></div>${QZ.wrong.length?`<div class="nb p-4 mb-4"><h3 class="font-bold mb-2">${T('الأجوبة الصحيحة','Correct answers')}</h3>${QZ.wrong.map(w=>`<div class="py-2 border-b border-gray-100"><div class="text-sm">${esc(w.q)}</div><div class="text-sm" style="color:#b91c1c">${T('جوابك: ','Your answer: ')}${esc(w.you)}</div><div class="font-bold" style="color:#15803d">${T('الصحيح: ','Correct: ')}${esc(w.a)}</div></div>`).join('')}</div>`:''}<button class="btn w-full" onclick="QZ=null;qzStart()">${T('اختبار جديد','New quiz')}</button>`}
 const q=QZ.qs[QZ.i],pk=QZ.pick;
 return `<div class="nb p-5 mb-4"><div class="flex justify-between text-sm text-gray-500 mb-2"><span>${T('سؤال ','Question ')+(QZ.i+1)+' / '+QZ.qs.length}</span><span>${T('الصحيحة: ','Correct: ')+QZ.score}</span></div><div class="font-black text-lg mb-4" dir="auto">${esc(q.q)}</div><div class="grid gap-2">${q.o.map((o,k)=>{const right=o===q.a,cl=pk===null?'':right?'gr':k===pk?'rd':'',st=pk===null?'':right?'background:#16a34a!important;color:#fff!important':k===pk?'background:#dc2626!important;color:#fff!important':'opacity:.5';return `<button class="nb ${cl} p-3 text-start font-bold" dir="auto" style="${st}" onclick="qzPick(${k})">${esc(o)}</button>`}).join('')}</div>${pk!==null?`<button class="btn w-full mt-4" onclick="qzNext()">${QZ.i<QZ.qs.length-1?T('السؤال التالي','Next question'):T('النتيجة','See result')}</button>`:''}</div><button class="btn bg-white" onclick="QZ=null;render()">${T('إنهاء','Quit')}</button>`}
function quizResults(){const since=Date.now()-7*864e5,list=RUN().map(r=>{const q=(S.quiz||[]).filter(x=>x.rid===r.id&&x.at>=since);const first=q.length?q[0]:null,best=q.reduce((m,x)=>Math.max(m,x.score/x.total),0);return {r,n:q.length,first,best,last:q[q.length-1]}}).sort((a,b)=>b.best-a.best||b.n-a.n);
 const miss={};(S.quiz||[]).filter(x=>x.at>=since).forEach(x=>(x.wrong||[]).forEach(w=>miss[w]=(miss[w]||0)+1));const top=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,8);
 return `<div class="nb p-4 mb-4"><h3 class="font-black mb-2">${T('نتائج اختبار المنيو — آخر 7 أيام','Menu quiz results — last 7 days')} (${deptName(DEPT)})</h3>${list.map(x=>`<div class="flex justify-between items-center py-2 border-b border-gray-100 gap-2"><span class="font-semibold">${avImg(x.r,24)} ${esc(x.r.name)}</span><span class="text-sm">${x.n?T('محاولات ','attempts ')+x.n+' · '+T('أفضل ','best ')+Math.round(x.best*100)+'% · '+T('آخر ','last ')+x.last.score+'/'+x.last.total:`<span class="pill warn">${T('ما سوى اختبار','No quiz yet')}</span>`}</span></div>`).join('')||'-'}</div>${top.length?`<div class="nb p-4"><h3 class="font-black mb-2">${T('أكثر أجوبة يغلطون بيها','Most missed answers')}</h3>${top.map(t=>`<div class="flex justify-between py-1"><span dir="auto">${esc(t[0])}</span><b>${t[1]}</b></div>`).join('')}</div>`:''}`}
/* manager devices award the daily quiz point (staff cannot write points) */

 (S.quiz||[]).slice().sort((a,b)=>a.at-b.at).forEach(q=>{const k=q.rid+'|'+q.day;if(!first[k])first[k]=q});

/* aggregation */
function dishStats(R){const inR=x=>x.at>=R.from&&x.at<R.to,C=(S.dcomp||[]).filter(inR),L=(S.dsales||[]).filter(inR);
 const comp={};C.forEach(x=>{const o=comp[x.mid]=comp[x.mid]||{mid:x.mid,n:0,reasons:{},tables:[],rep:0,reps:{}};o.n++;o.reasons[x.reason]=(o.reasons[x.reason]||0)+1;o.tables.push(x.table);if(x.replaced){o.rep++;if(x.rmid)o.reps[x.rmid]=(o.reps[x.rmid]||0)+1}});
 const top=(f,q)=>{const m={};L.forEach(x=>{if(!x[f])return;const o=m[x[f]]=m[x[f]]||{mid:x[f],days:0,qty:0,caps:new Set()};o.days++;o.qty+=x[q]||0;o.caps.add(x.rid)});return Object.values(m).sort((a,b)=>b.days-a.days||b.qty-a.qty)};
 return {C,L,comp:Object.values(comp).sort((a,b)=>b.n-a.n),food:top('food','fq'),drink:top('drink','dq'),shisha:top('shisha','sq')}}

 const L=(S.tday||[]).filter(a=>!a.del&&taHas(a,x.table)&&a.rid!==x.rid&&taEnd(a)>x.at).sort((a,b)=>Math.max(taStart(a),x.at)-Math.max(taStart(b),x.at)||(a.all?1:0)-(b.all?1:0));return L.length?{rid:L[0].rid,at:taStart(L[0])}:null}
function hnSave(){const D=hnDraft(),r=me(),text=String(D.text||'').trim(),table=String(D.table||'').trim().toUpperCase();if(!table)return toast(T('اكتب رقم الطاولة','Enter the table number'));if(!text)return toast(T('اكتب الملاحظة','Write the note'));
 const x={id:'hn'+Date.now(),at:Date.now(),rid:r?r.id:'',by:LX(()=>meName()),text,table,imp:D.imp?1:0,done:0};S.hnotes=S.hnotes||[];S.hnotes.push(x);
 const to=hnRecipient(x);if(to)x.sentTo=to.rid;if(to)notify(to.rid,D.imp?'warn':'info',LX(()=>T('تسليم طاولة ','Table handover ')+table),LX(()=>text.slice(0,140)));
 HND=null;HNOPEN=false;save();render();toast(to?T('توصل لـ ','Delivered to ')+nm(to.rid):T('تنحفظ وتوصل للكابتن اللي يستلم الطاولة بعد التوزيع','Saved — it reaches whoever is assigned this table next'))}
function hnDone(id){const x=(S.hnotes||[]).find(v=>v.id===id);if(!x)return;x.done=x.done?0:1;x.doneBy=LX(()=>meName());x.doneAt=Date.now();save();render()}
function hnDel(id){const x=(S.hnotes||[]).find(v=>v.id===id),r=me();if(!x||!(isStaff()||(r&&x.rid===r.id&&!x.done)))return;if(!confirm(T('حذف الملاحظة؟','Delete this note?')))return;S.hnotes=(S.hnotes||[]).filter(v=>v.id!==id);save();render()}
const hnRecent=()=>(S.hnotes||[]).filter(x=>Date.now()-x.at<48*36e5||!x.done);
const hnForMe=rid=>hnRecent().filter(x=>!x.done&&(hnRecipient(x)||{}).rid===rid);
function hnForm(){const D=hnDraft();return `<div class="nb p-4 mb-4"><h3 class="font-black mb-1">${T('تسليم طاولة للشفت الجاي','Hand over a table to the next shift')}</h3><div class="text-sm text-gray-500 mb-3">${T('الملاحظة توصل بس للكابتن اللي يستلم هاي الطاولة بالشفت الجاي حسب التوزيع.','The note reaches only the captain who takes this table next, per the distribution.')}</div>
 <label class="text-xs font-bold">${T('رقم الطاولة','Table number')}<input class="inp mb-2" value="${esc(D.table)}" oninput="HND.table=this.value" placeholder="${T('مثل: 12','e.g. 12')}"></label>
 <label class="text-xs font-bold">${T('شنو لازم يعرف','What they need to know')}<textarea class="inp" rows="3" oninput="HND.text=this.value" placeholder="${T('مثلاً: عدهم عيد ميلاد، الكيكة بالثلاجة وتطلع الساعة 10','e.g. birthday, the cake is in the fridge, serve at 10')}">${esc(D.text)}</textarea></label>
 <label class="font-semibold mt-3 block"><input type="checkbox" ${D.imp?'checked':''} onchange="HND.imp=this.checked?1:0"> ${T('مهمة','Important')}</label>
 <div class="flex gap-2 mt-4"><button class="btn gr" onclick="hnSave()">${T('تسليم','Hand over')}</button><button class="btn bg-white" onclick="HNOPEN=false;HND=null;render()">${T('إلغاء','Cancel')}</button></div></div>`}
function hnRow(x,view){const to=hnRecipient(x),r=me(),mine=r&&x.rid===r.id;
 return `<div class="nb p-3 mb-2" style="${x.imp&&!x.done?'border-inline-start:5px solid #dc2626':''}${x.done?';opacity:.6':''}"><div class="flex justify-between gap-2 flex-wrap items-center"><span class="font-black text-lg">${T('طاولة ','Table ')}${esc(x.table||'-')}${x.imp?` <span class="pill bad">${T('مهمة','Important')}</span>`:''}</span><span class="text-xs text-gray-500">${fmt(x.at)}</span></div><div class="mt-1" style="white-space:pre-wrap">${esc(x.text)}</div>
 <div class="text-sm text-gray-500 mt-2">${T('من: ','From: ')}${esc(loc(x.by)||'')} · ${T('إلى: ','To: ')}${to?esc(nm(to.rid)||'?'):`<span style="color:#b45309">${T('بانتظار توزيع الشفت الجاي','Waiting for the next shift’s distribution')}</span>`}</div>
 <div class="flex gap-2 mt-2 items-center flex-wrap">${x.done?`<span class="pill ok">${T('استلمها ','Received by ')+esc(loc(x.doneBy)||'')}</span>`:''}${(view==='to'||isStaff())&&!x.done?`<button class="btn gr !py-1" onclick="hnDone('${x.id}')">${T('استلمت','Received')}</button>`:''}${x.done&&isStaff()?`<button class="btn bg-white !py-1" onclick="hnDone('${x.id}')">${T('رجّعها مفتوحة','Reopen')}</button>`:''}${isStaff()||(mine&&!x.done)?`<button class="btn bg-white !py-1 ms-auto" onclick="hnDel('${x.id}')">${T('حذف','Delete')}</button>`:''}</div></div>`}
function vHandover(){const staff=staffMode(),r=me(),form=HNOPEN?hnForm():`<button class="btn ${staff?'w-full':''} mb-4" onclick="HNOPEN=true;HND=null;render()">+ ${T('تسليم طاولة','Hand over a table')}</button>`;
 if(staff&&r){const toMe=hnForMe(r.id),byMe=(S.hnotes||[]).filter(x=>x.rid===r.id).sort((a,b)=>b.at-a.at).slice(0,20);
  return form+`<h3 class="font-black mb-2">${T('طاولات استلمتها','Tables handed to me')} (${toMe.length})</h3>`+(toMe.length?toMe.slice().sort((a,b)=>(b.imp-a.imp)||(b.at-a.at)).map(x=>hnRow(x,'to')).join(''):`<div class="nb p-4 mb-4 text-sm text-gray-500">${T('ماكو ملاحظات على طاولاتك','No notes for your tables')}</div>`)
   +(byMe.length?`<h3 class="font-black mt-4 mb-2">${T('اللي سلّمتها','Notes I handed over')}</h3>`+byMe.map(x=>hnRow(x,'by')).join(''):'')}
 const open=hnRecent().filter(x=>!x.done).sort((a,b)=>(b.imp-a.imp)||(b.at-a.at)),old=(S.hnotes||[]).filter(x=>x.done).sort((a,b)=>b.at-a.at).slice(0,40);
 return form+`<h3 class="font-black mb-2">${T('ملاحظات مفتوحة','Open notes')} (${open.length})</h3>`+(open.length?open.map(x=>hnRow(x,'mgr')).join(''):`<div class="nb p-4 mb-4 text-sm text-gray-500">${T('ماكو ملاحظات مفتوحة','No open notes')}</div>`)+(old.length?`<h3 class="font-black mt-4 mb-2">${T('المستلمة','Received')}</h3>`+old.map(x=>hnRow(x,'mgr')).join(''):'')}
function thBanner(r){if((r.dept||'runner')!=='captain')return '';const a=thMine(r.id);if(!a||a.all||taStart(a)-30*6e4>Date.now())return '';const pend=(a.tables||[]).filter(t=>!thRec(a,t)&&thPrev(a,t));if(!pend.length)return '';
 return `<div class="nb ye p-3 mb-4 flex justify-between items-center gap-2 flex-wrap"><span class="font-bold">${T('استلم طاولاتك: ','Take over your tables: ')}${pend.map(esc).join(T('، ',', '))}</span><button class="btn gr !py-1" onclick="openRS('mytables')">${T('استلام','Take over')}</button></div>`}
function hnBanner(r){if((r.dept||'runner')!=='captain')return '';const L=hnForMe(r.id);if(!L.length)return '';const imp=L.filter(x=>x.imp).length;
 return `<div class="nb ${imp?'rd':'ye'} p-3 mb-4 flex justify-between items-center gap-2 flex-wrap"><span class="font-bold">${T('عندك ملاحظات على طاولاتك: ','Notes on your tables: ')}${L.map(x=>esc(x.table)).join(T('، ',', '))}</span><button class="btn bg-white !py-1" onclick="openRS('handover')">${T('اقرأها','Read')}</button></div>`}

/* ---------- Table takeover between captains: who held each table, from when to when ---------- */
function thPrev(a,t){if(a.all)return '';const o=ownersAt(t,taStart(a)-6e4).filter(r=>r!==a.rid);return o[0]||''}
function thReceive(aid,tables){const a=(S.tday||[]).find(x=>x.id===aid&&!x.del),r=me(),mgr=isStaff();if(!a||a.all)return;if(!mgr&&(!r||a.rid!==r.id))return;const now=Date.now(),by={};
 tables.forEach(t=>{if(thRec(a,t)||!(a.tables||[]).includes(t))return;const from=thPrev(a,t);S.thand=S.thand||[];S.thand.push({id:'th_'+a.id+'_'+t,ta:a.id,day:a.day,table:t,from,to:a.rid,at:now,by:LX(()=>meName())});if(from)(by[from]=by[from]||[]).push(t)});
 Object.entries(by).forEach(([from,ts])=>notify(from,'info',LX(()=>T('تسليم طاولات','Tables handed over')),LX(()=>nm(a.rid)+T(' استلم منك: ',' took over: ')+ts.join(T('، ',', '))+T(' الساعة ',' at ')+hm(now))));
 save();render();toast(T('تم تسجيل الاستلام الساعة ','Takeover recorded at ')+hm(now))}
function thUndo(id){if(!isStaff()||!confirm(T('إلغاء تسجيل الاستلام؟','Undo this takeover record?')))return;S.thand=(S.thand||[]).filter(h=>h.id!==id);save();render()}
function thCard(r){const a=thMine(r.id);if(!a||a.all)return '';const mine=a.tables||[];if(!mine.length)return '';const pend=mine.filter(t=>!thRec(a,t)&&thPrev(a,t));
 return `<div class="nb ${pend.length?'ye':''} p-4 mb-4"><div class="flex justify-between items-center gap-2 flex-wrap mb-2"><div class="font-black">${T('استلام الطاولات','Taking over tables')} — ${a.from} - ${a.to}</div>${pend.length>1?`<button class="btn gr !py-1" onclick="thReceive('${a.id}',${esc(JSON.stringify(pend))})">${T('استلمت كل الطاولات','I took all tables')}</button>`:''}</div>
 ${mine.map(t=>{const h=thRec(a,t),from=h?h.from:thPrev(a,t);return `<div class="flex justify-between items-center gap-2 py-2 border-b border-gray-100 flex-wrap"><span><b>${T('طاولة ','Table ')}${esc(t)}</b> <span class="text-sm text-gray-500">${from?T('من ','from ')+esc(nm(from)):T('تبدي عليها من ','yours from ')+a.from}</span></span>${h?`<span class="pill ok">${T('استلمتها ','Taken at ')+hm(h.at)}</span>`:from?`<button class="btn bg-white !py-1" onclick="thReceive('${a.id}',['${esc(t)}'])">${T('استلمت','Taken')}</button>`:''}</div>`}).join('')}
 <div class="text-xs text-gray-500 mt-2">${T('من تستلم الطاولة ينسجل الوقت: أي شي بعده يصير باسمك، وقبله باسم الكابتن السابق. إذا ما ضغطت، يُعتمد وقت بدايتك.','Taking a table records the time: anything after it counts for you, before it for the previous captain. Otherwise your start time is used.')}</div></div>`}
function thPanel(){const day=tDay(),rows=[];taDay(day).filter(a=>!a.all).forEach(a=>(a.tables||[]).forEach(t=>{const h=thRec(a,t),from=h?h.from:thPrev(a,t);if(from||h)rows.push({a,t,h,from})}));if(!rows.length)return '';
 rows.sort((x,y)=>taStart(x.a)-taStart(y.a));const pend=rows.filter(x=>!x.h);
 return `<div class="nb p-4 mb-4"><div class="flex justify-between items-center gap-2 flex-wrap ${TTH?'mb-2':''}"><div class="font-black">${T('التسليم بين الكباتن','Handover between captains')} <span class="text-sm font-semibold text-gray-500">${T('مستلمة ','taken ')}${rows.length-pend.length} / ${rows.length}</span></div><button class="btn bg-white !py-1" onclick="TTH=!TTH;render()">${TTH?T('إخفاء','Hide'):T('عرض','Show')}</button></div>${TTH?`
 ${rows.map(x=>`<div class="flex justify-between items-center gap-2 py-2 border-b border-gray-100 flex-wrap"><span><b>${T('طاولة ','Table ')}${esc(x.t)}</b> <span class="text-sm">${esc(nm(x.from)||'—')} ← ${esc(nm(x.a.rid))}</span> <span class="text-xs text-gray-500">(${x.a.from})</span></span>${x.h?`<span class="flex gap-2 items-center"><span class="pill ok">${T('استلمها ','Taken at ')+hm(x.h.at)}</span>${isStaff()?`<button class="btn bg-white !py-1 text-sm" onclick="thUndo('${x.h.id}')">${T('إلغاء','Undo')}</button>`:''}</span>`:`<span class="flex gap-2 items-center"><span class="pill warn">${T('بعده ما استلم','Not taken yet')}</span>${isStaff()&&taStart(x.a)-36e5<=Date.now()?`<button class="btn bg-white !py-1 text-sm" onclick="thReceive('${x.a.id}',['${esc(x.t)}'])">${T('سجّل الآن','Record now')}</button>`:''}</span>`}</div>`).join('')}`:''}</div>`}
let TTH=false;
function tTimeline(){if(!TSEL)return '';const segs=tableSegs(TSEL,tDay());
 return `<div class="nb p-4 mb-4" style="border-color:#3a2430"><div class="flex justify-between items-center mb-2"><div class="font-black">${T('سجل الطاولة ','Table log ')}${esc(TSEL)} — ${esc(tDay())}</div><button class="btn bg-white !py-1" onclick="TSEL=null;render()">${T('إغلاق','Close')}</button></div>
 ${segs.length?segs.map(x=>`<div class="flex justify-between items-center py-2 border-b border-gray-100 gap-2 flex-wrap"><span class="font-semibold" style="border-inline-start:4px solid ${x.rids.length===1?capColor(x.rids[0]):'#6b7280'};padding-inline-start:8px">${esc(x.rids.map(nm).join(' + '))}</span><span class="text-sm">${T('من ','from ')}${hm(x.from)} ${T('إلى ','to ')}${hm(x.to)}</span><span class="text-xs text-gray-500">${x.h?T('استلام مسجّل','takeover recorded'):T('حسب الوقت المكتوب','by scheduled time')}</span></div>`).join(''):`<div class="text-sm text-gray-500">${T('ماكو توزيع لهاي الطاولة بهذا اليوم','No distribution for this table on this day')}</div>`}</div>`}

/* ---------- Render ---------- */
function render(){
 setLang();document.body.classList.toggle('auth',!S.session);const app=document.getElementById('app');
 if(!S.session){app.innerHTML=vLogin()+dlgHtml();return}
 let tabs,body;
 if(isStaff()){
  const mds=myDepts();if(!mds.includes(DEPT))DEPT=mds[0]||'runner';const full=isOwner();
  let base;
  if(DEPT==='runner')base=[['dash','tDash'],['ai','tAI'],['notes','tNotes'],['breaks','tBreaks'],['shifts','tShifts'],['assign','tAssign'],['check','tCheck'],['menu','tMenu'],['meetings','tMeet'],['scores','tScore'],['stats','tStats'],['report','tReport'],['daily','tDaily'],['warns','tWarns'],['league','tLeague'],['mreport','tMRep'],['profile','tProf'],['shiftcmp','tCmp'],['chat','tChat']];
  else base=[['dash','tDash'],['ai','tAI'],['notes','tNotes'],['breaks','tBreaks'],['shifts','tShifts'],['check','tCheck'],['menu','tMenu'],['meetings','tMeet'],['scores','tScore'],['stats','tStats'],['report','tReport'],['daily','tDaily'],['warns','tWarns'],['profile','tProf'],['mreport','tMRep'],['chat','tChat']];
  if(DEPT==='captain'){base.splice(3,0,['wrongfood','tWrong'],['complaints','tComp'],['praise','tPraise'],['handover','tHand'],['sales','tSales'],['capleague','tCapLg']);base.push(['tables','tTables']);}
  const extra=full?(DEPT==='runner'?[['people','tPeople'],['salary','tSalary'],['broken','tBroken'],['settings','tSet'],['log','tLog']]:[['people','tPeople'],['salary','tSalary'],['settings','tSet'],['log','tLog']]):[];
  tabs=base.concat(extra);
  body={check:vCheck,league:vLeague,mreport:vMReport,warns:vWarns,profile:vProfile,shiftcmp:vShiftCmp,salary:vSalary,notes:vNotes,daily:vDaily,dash:vDash,shifts:vShifts,settings:vSettings,scores:vScores,stats:vStats,log:vLog,breaks:vBreaks,assign:vAssign,report:vReport,chat:vChat,broken:vBroken,people:vRunners,runners:vRunners,wrongfood:vWrong,tables:vTables,ai:vAI,menu:vMenu,meetings:vMeetings,complaints:vComplaints,sales:vSales,praise:vPraise,handover:vHandover,capleague:vCapLeague}[tab]||vDash;
  if(!tabs.some(x=>x[0]===tab)){tab='dash';body=vDash}
 }else{tabs=[['me','tMe']];tab='me';body=runnerRoot}
 const G={praise:0,handover:0,capleague:1,complaints:0,sales:2,meetings:0,menu:0,ai:0,tables:0,wrongfood:0,people:1,check:0,league:1,mreport:2,warns:1,profile:2,shiftcmp:2,me:0,salary:2,notes:0,dash:0,breaks:0,shifts:0,assign:0,chat:0,runners:1,scores:1,stats:2,report:2,daily:2,broken:2,log:2,settings:3,rules:3},GL=[T('التشغيل','Operations'),T('الفريق','Team'),T('التقارير','Reports'),T('النظام','System')];
 const lab=x=>x[0]==='people'?deptName(DEPT):(x[0]==='check'&&DEPT==='host')?T('النظافة','Grooming'):(t(x[1])||x[1]),cur=tabs.find(x=>x[0]===tab)||tabs[0];
 const side=GL.map((g,i)=>{const it=tabs.filter(x=>G[x[0]]===i);return it.length?`<div class="navg">${g}</div>`+it.map(x=>`<a class="nav ${tab===x[0]?'on':''}" onclick="go('${x[0]}')">${lab(x)}</a>`).join(''):''}).join('');
 const prim=tabs.length<=2?tabs:tabs.filter(x=>['dash','breaks','shifts','daily'].includes(x[0]));
 const bot=prim.map(x=>`<a class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')">${lab(x)}</a>`).join('')+(tabs.length>2?`<a onclick="MORE=true;render()">${T('المزيد','More')}</a>`:'');
  const sheet=MORE?`<div class="sheet" onclick="MORE=false;render()"><div onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-1"><div class="font-bold text-lg">${T('الأقسام','Sections')}</div><button class="btn bg-white !py-1" onclick="MORE=false;render()">${T('إغلاق','Close')}</button></div>${GL.map((g,i)=>{const it=tabs.filter(x=>G[x[0]]===i);return it.length?`<div class="text-xs font-bold text-gray-500 mt-3 mb-1">${g}</div><div class="grid grid-cols-2 gap-2">${it.map(x=>`<button class="btn ${tab===x[0]?'':'bg-white'}" onclick="go('${x[0]}')">${lab(x)}</button>`).join('')}</div>`:''}).join('')}</div></div>`:'';
 app.innerHTML=`<div class="shell"><aside class="side"><div class="flex items-center gap-3 px-2 pb-4 mb-2 border-b border-zinc-800"><div class="brand">AH</div><div><div class="font-bold text-white leading-tight">${t('app')}</div><div class="text-xs text-zinc-500">${esc((S.cfg&&S.cfg.name)||t('sub'))}</div></div></div>${side}<div class="usercard"><div class="text-white font-semibold">${esc(S.session.role==='runner'?(me()||{}).name:meName())}</div><div class="mb-2">${S.session.role==='owner'?T('المدير','Manager'):S.session.role==='mgr'?T('مدير مناوب','Shift manager'):({runner:T('رنر','Runner'),captain:T('كابتن','Captain'),host:T('موظف استقبال','Reception staff')}[(me()||{}).dept||'runner'])}</div><a class="nav" onclick="logout()">${t('logout')}</a></div></aside><div class="main-col"><div class="topbar"><button class="burger" onclick="MORE=true;render()" aria-label="menu"><i></i><i></i><i></i></button><div class="font-bold text-lg truncate md:hidden">${lab(cur)}</div><div class="hidden md:block text-sm text-gray-500">${new Date().toLocaleDateString(S.lang==='ar'?'ar-IQ-u-nu-latn':'en-GB',{weekday:'long',day:'numeric',month:'long'})}</div><div class="flex items-center gap-2"><span class="text-xs font-semibold px-2 py-1 rounded-full border border-gray-300">${navigator.onLine?(DB?(dbErr?T('خطأ مزامنة','Sync error'):dbOk?T('متصل','Online'):'...'):T('محلي','Local')):T('بدون إنترنت','Offline')}</span><span class="text-sm text-gray-500 hidden md:inline">${esc(S.session.role==='runner'?(me()||{}).name:meName())}</span><button class="btn bg-white" onclick="toggleLang()">AR | EN</button><button class="btn" onclick="logout()">${t('logout')}</button></div></div><main class="content">${switcher()}${notifBanner()}<div class="mb-5"><h1 class="text-2xl font-bold tracking-tight">${lab(cur)}</h1><p class="text-sm text-gray-500">${DESC()[cur[0]]||''}</p></div>${body()}</main></div>${sheet}${profSheet()}${notesSheet()}${callSheet()}${dlgHtml()}</div>`;
 tick();
}
{const _rr=render;render=function(){try{_rr()}catch(e){console.error(e);toast('Error: '+(e&&e.message?e.message:e))}}}
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('firebase-messaging-sw.js').catch(()=>{})}catch(e){}
render();
ensureSeed(S);save();
if(DB){initReset().then(()=>{pull();setInterval(pull,8000)})}
/* splash: plays on every open, tap to skip */
(function(){const sp=document.getElementById('splash');if(!sp){document.body.classList.remove('splashing');return}const sb=sp.querySelector('.sp-sub');if(sb&&S.lang==='en')sb.textContent='Amaya Restaurant \u00b7 Baghdad, Mansour';let rm=false;try{rm=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)}catch(e){}let done=false;
 const end=()=>{if(done)return;done=true;sp.classList.add('out');setTimeout(()=>{document.body.classList.remove('splashing');setTimeout(()=>{LGANIM=false},1200)},rm?0:420);setTimeout(()=>sp.remove(),1100)};
 sp.addEventListener('click',end);setTimeout(end,rm?250:2500)})();
if(S.session&&window.Notification&&Notification.permission==='granted'&&(S.session.role!=='runner'||notifOn(S.session.id)))enablePush();
