<style>

.tk .hl,.bt .hl{margin:6px 0 0;padding:6px 0 2px;border-top:3px dashed var(--fg);font-weight:800;font-size:17px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.tk .hl small,.bt .hl small{font-size:13px;font-weight:600;color:var(--dim)}

<script>
/*
 Amaya KDS — single-file kitchen display.
 URL options (all optional):
   view=tables | orders       tables grid, tap a table for its orders (default) / one ticket per order
   st=kitchen | bev | all     station to show (default all)
   late=20                    minutes before an order turns late
   lang=ar | en | tr          interface language (default ar)
   poll=4                     seconds between refreshes
   ro=1                       read-only screen: hides the Ready button
   print=1                    print a kitchen ticket for every new order of this station (for silent printing run Chrome with --kiosk-printing)
   push=https://...           push service that sends phone notifications (default: the restaurant's)
   dead=x1,y1,x2,y2           ignore touches inside this rectangle (screen percentages, for a cracked area)
   demo=1                     fake orders, no database
   db=https://...             database base URL (default: the restaurant Firebase Realtime Database)
   auth=TOKEN                 database auth token if the database rules require it
*/
const Q=new URLSearchParams(location.search);
const CFG={view:Q.get('view')==='orders'?'orders':'tables',st:Q.get('st')||'all',late:Math.max(1,+Q.get('late')||20),lang:['ar','en','tr'].includes(Q.get('lang'))?Q.get('lang'):'ar',poll:Math.max(2,+Q.get('poll')||4),ro:Q.get('ro')==='1',print:Q.get('print')==='1',push:(Q.get('push')||'https://restless-salad-2a4b.abdualdore.workers.dev').replace(/\/+$/,''),demo:Q.get('demo')==='1',
 db:(Q.get('db')||'https://amaya-runner-default-rtdb.europe-west1.firebasedatabase.app').replace(/\/+$/,''),auth:Q.get('auth')||'',dead:(Q.get('dead')||'').split(',').map(Number).filter(n=>!isNaN(n))};
const TX={
 ar:{login:'تسجيل الدخول لقاعدة البيانات',user:'اسم المستخدم',pass:'كلمة السر',signin:'دخول',bad:'اسم المستخدم أو كلمة السر غير صحيحة',loginS:'سجّل الدخول مرة واحدة بحساب مدير أو كابتن، وستبقى الشاشة متصلة.',logout:'خروج',tables:'طاولات',sent:'أُرسل',ago:'منذ',lateBy:'متأخر',min:'د',batch:'الدفعة',close:'إغلاق',opened:'فُتحت',waiting:'قيد التحضير',items:'أصناف',noOrd:'لا توجد طلبات بعد',kitchen:'المطبخ',bev:'البار',all:'كل الأقسام',open:'طلبات',late:'متأخرة',table:'طاولة',guests:'أشخاص',empty:'لا توجد طلبات',emptyS:'الشاشة تتحدث تلقائياً',gate:'اضغط مرة واحدة لتشغيل الصوت',gateB:'تشغيل',on:'متصل',off:'غير متصل',demo:'تجربة',more:'أصناف أخرى',note:'ملاحظة',sugar:{sweet:'حلوة',medium:'وسط',none:'بدون سكر'},auth:'قاعدة البيانات تطلب تسجيل دخول (auth)',done:'تم التسليم',ready:'جاهز',readyAt:'جاهز',sending:'يُرسل خلال',undo:'تراجع',shisha:'النركيلة'},
 en:{login:'Sign in to the database',user:'Username',pass:'Password',signin:'Sign in',bad:'Wrong username or password',loginS:'Sign in once with a manager or captain account; the screen stays signed in.',logout:'Sign out',tables:'tables',sent:'Sent',ago:'',lateBy:'Late',min:'min',batch:'Batch',close:'Close',opened:'Opened',waiting:'to make',items:'items',noOrd:'No orders yet',kitchen:'Kitchen',bev:'Bar',all:'All stations',open:'orders',late:'late',table:'Table',guests:'guests',empty:'No orders',emptyS:'The screen updates by itself',gate:'Tap once to enable sound',gateB:'Start',on:'Online',off:'Offline',demo:'Demo',more:'more items',note:'Note',sugar:{sweet:'Sweet',medium:'Medium',none:'No sugar'},auth:'The database requires sign-in (auth)',done:'Delivered',ready:'Ready',readyAt:'Ready',sending:'Sending in',undo:'Undo',shisha:'Shisha'},
 tr:{login:'Veritabanına giriş',user:'Kullanıcı adı',pass:'Şifre',signin:'Giriş',bad:'Kullanıcı adı veya şifre hatalı',loginS:'Bir yönetici veya kaptan hesabıyla bir kez giriş yapın; ekran oturumu açık tutar.',logout:'Çıkış',tables:'masa',sent:'Gönderildi',ago:'',lateBy:'Gecikme',min:'dk',batch:'Sipariş',close:'Kapat',opened:'Açılış',waiting:'hazırlanacak',items:'ürün',noOrd:'Henüz sipariş yok',kitchen:'Mutfak',bev:'Bar',all:'Tüm istasyonlar',open:'sipariş',late:'gecikmiş',table:'Masa',guests:'misafir',empty:'Sipariş yok',emptyS:'Ekran kendiliğinden güncellenir',gate:'Sesi açmak için bir kez dokunun',gateB:'Başlat',on:'Çevrimiçi',off:'Çevrimdışı',demo:'Deneme',more:'ürün daha',note:'Not',sugar:{sweet:'Şekerli',medium:'Orta',none:'Şekersiz'},auth:'Veritabanı oturum açma istiyor (auth)',done:'Teslim edildi',ready:'Hazır',readyAt:'Hazır',sending:'Gönderiliyor',undo:'Geri al',shisha:'Nargile'}};
const L=TX[CFG.lang];L.hold=({ar:'انتظار',en:'Hold',tr:'Bekle'})[CFG.lang];L.holdS=({ar:'لا تبدأ حتى يصل Fire',en:'Do not start until Fire',tr:'Fire gelene kadar başlama'})[CFG.lang];document.documentElement.lang=CFG.lang;document.documentElement.dir=CFG.lang==='ar'?'rtl':'ltr';
const $=id=>document.getElementById(id);
$('st').textContent=L[CFG.st]||L.all;$('lOpen').textContent=L.open;$('lLate').textContent=L.late;$('eT').textContent=L.empty;$('eS').textContent=L.emptyS;$('gS').textContent=L.gate;$('gB').textContent=L.gateB;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>{d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};

/* ---------- sound (Web Audio, no files) ---------- */
let AC=null;
function audioOn(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();tone(880,.08,0)}catch(e){}}
function tone(f,d,at,type,vol){if(!AC)return;const t=AC.currentTime+(at||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.35,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02)}
const chimeNew=()=>{tone(988,.14,0);tone(1319,.14,.16);tone(1568,.22,.32)};
const chimeLate=()=>{tone(440,.22,0,'sawtooth',.3);tone(440,.22,.3,'sawtooth',.3)};
$('gate').addEventListener('click',()=>{audioOn();$('gate').style.display='none';wake()});

/* keep the screen on where supported */
let WL=null;async function wake(){try{if('wakeLock' in navigator){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();if(AC&&AC.state==='suspended')AC.resume()}});

/* block touches inside a cracked area */
if(CFG.dead.length===4){const [x1,y1,x2,y2]=CFG.dead;const d=document.createElement('div');d.style.cssText=`position:fixed;left:${Math.min(x1,x2)}%;top:${Math.min(y1,y2)}%;width:${Math.abs(x2-x1)}%;height:${Math.abs(y2-y1)}%;z-index:20`;['touchstart','touchend','click','pointerdown'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation()},{passive:false}));document.body.appendChild(d)}
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('#det .db'))e.preventDefault()},{passive:false});

let OPEN='';
function tablesData(){const now=Date.now(),lim=CFG.late*6e4,today=dayKey();const by={};
 ORDERS.forEach(o=>{if(!CFG.demo&&o.day!==today&&now-o.at>12*36e5)return;const s=SESS[o.sess];if(!CFG.demo&&s&&s.end)return;const its=(o.items||[]).filter(x=>CFG.st==='all'||(x.g||'kitchen')===CFG.st);if(!its.length)return;(by[o.sess]=by[o.sess]||[]).push(o)});
 Object.values(SESS).forEach(s=>{if(!s.end&&(CFG.demo||s.day===today)&&!by[s.id])by[s.id]=[]});
 return Object.entries(by).map(([sid,oo])=>{const s=SESS[sid]||{},o0=oo[0]||{};oo.sort((a,b)=>a.at-b.at);const pend=oo.filter(o=>!o.hold&&!rdy(o,CFG.st)),oldest=pend.length?pend[0].at:0;
  const cnt=o=>(o.items||[]).filter(x=>CFG.st==='all'||(x.g||'kitchen')===CFG.st).reduce((a,x)=>a+(+x.qty||0),0);
  return {sid,table:s.table||o0.table||'?',cn:o0.cn||'',gs:s.guests||o0.gs||'',opened:s.at||o0.at,oo,items:oo.reduce((a,o)=>a+cnt(o),0),wait:pend.reduce((a,o)=>a+cnt(o),0),held:oo.filter(o=>o.hold).reduce((a,o)=>a+cnt(o),0),oldest,late:!!oldest&&now-oldest>lim}})
  .sort((a,b)=>(b.late-a.late)||((a.oldest||9e15)-(b.oldest||9e15))||String(a.table).localeCompare(String(b.table),undefined,{numeric:true}))}
function drawTables(){const D=tablesData(),now=Date.now(),lim=CFG.late*6e4;
 const ids=[];D.forEach(t=>t.oo.forEach(o=>ids.push(o.id)));if(SEEN===null)SEEN=new Set(ids);let fresh=false;ids.forEach(id=>{if(!SEEN.has(id)){SEEN.add(id);fresh=true}});if(fresh)chimeNew();
 D.forEach(t=>t.oo.forEach(o=>{if(!o.hold&&!rdy(o,CFG.st)&&now-o.at>lim&&!LATEWARN[o.id]){LATEWARN[o.id]=1;chimeLate()}}));
 $('kOpen').textContent=D.length;$('lOpen').textContent=L.tables;$('kLate').textContent=D.filter(t=>t.late).length;
 $('empty').style.display=D.length?'none':'flex';
 const G=$('grid'),W=G.clientWidth,H=G.clientHeight,cols=Math.max(2,Math.floor((W+10)/(W<520?170:210))),rows=Math.max(1,Math.floor((H+10)/(W<520?150:170))),cap=cols*rows,shown=D.slice(0,cap),hid=D.length-shown.length;
 $('over').style.display=hid?'inline-block':'none';$('over').textContent='+'+hid;
 const sig=JSON.stringify([cols,rows,shown.map(t=>[t.sid,t.items,t.wait,t.held,t.late,t.oo.length])]);
 if(sig!==SIG){SIG=sig;G.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;G.style.gridTemplateRows=`repeat(${rows},minmax(0,1fr))`;
  G.innerHTML=shown.map(t=>`<div class="tg${t.late?' late':''}${t.oldest?'':' calm'}" data-sid="${esc(t.sid)}"><div class="r1"><div><div class="ln">${L.table}</div><div class="tn">${esc(t.table)}</div></div><div class="tm" data-t="${t.oldest||t.opened}" data-l="${t.oldest?1:0}">--</div></div>
  <div class="ln">${esc(t.cn)}${t.gs?` · <b>${esc(t.gs)}</b> ${L.guests}`:''}</div><div class="bd">${t.items} ${L.items}${t.wait?` · ${t.wait} ${L.waiting}`:''}${t.held?` · ${t.held} ${L.hold}`:''}</div></div>`).join('')}
 if(OPEN)drawDetail();tickTimers()}
function minTxt(ms){return Math.max(0,Math.floor(ms/6e4))}
function drawDetail(){const t=tablesData().find(x=>x.sid===OPEN);if(!t){closeDet();return}const now=Date.now(),lim=CFG.late*6e4;
 $('dL').textContent=L.table;$('dT').textContent=t.table;$('dM').textContent=[t.cn,t.gs?t.gs+' '+L.guests:'',L.opened+' '+hhmm(t.opened)].filter(Boolean).join(' · ');$('dX').textContent=L.close;
 const html=t.oo.length?t.oo.map((o,i)=>{const its=(o.items||[]).filter(x=>CFG.st==='all'||(x.g||'kitchen')===CFG.st),age=now-o.at,R=rdy(o,CFG.st),late=!o.hold&&!R&&age>lim,rt=o.ready?Math.max(0,...myStations(o).map(g=>o.ready[g]||0)):0;
  const st=o.hold?L.hold+' · '+L.holdS:o.done?L.done:R?L.readyAt+(rt?' '+hhmm(rt):''):late?`${L.lateBy} ${minTxt(age-lim)} ${L.min}`:`${L.ago?L.ago+' ':''}${minTxt(age)} ${L.min}`;
  if(o.hold)return `<div class="bt held"><div class="bh"><span class="t">${L.batch} ${i+1} · ${L.hold}</span><span class="s">${L.holdS}</span></div><div class="bl">${its.map(x=>hRow(x,'it')).join('')}</div>${ON(o)?`<div class="nt2">${esc(ON(o))}</div>`:''}</div>`;
  return `<div class="bt${late?' late':''}${R?' done':''}"><div class="bh"><span class="t">${L.batch} ${i+1} · ${o.fired?'Fire · ':''}${L.sent} ${hhmm(o.at)}</span><span class="s">${st}</span></div><div class="bl">${its.map(x=>`<div class="it"><span class="q">${x.qty}×</span><span class="n">${esc(itemName(x))}${x.opt?`<span class="o">${esc(L.sugar[x.opt]||x.opt)}</span>`:''}${x.note?`<span class="x x2">${esc(x.note)}</span>`:''}</span></div>`).join('')}</div>${ON(o)?`<div class="nt2">${esc(ON(o))}</div>`:''}${R&&!(PEND[o.id]&&!PEND[o.id].sent)?'':rdBtn(o)}</div>`}).join(''):`<div class="ln" style="font-size:20px;padding:20px 0">${L.noOrd}</div>`;
 const h=JSON.stringify([t.oo.map(o=>[o.id,!!o.hold,(o.items||[]).length,rdy(o,CFG.st),now-o.at>lim,PEND[o.id]?Math.ceil((PEND[o.id].until-now)/1000):0]),minTxt(now)]);if($('dB').dataset.h!==h){$('dB').dataset.h=h;$('dB').innerHTML=html}}
const hhmm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
function openDet(sid){OPEN=sid;$('det').classList.add('on');$('dB').dataset.h='';drawDetail()}
function closeDet(){OPEN='';$('det').classList.remove('on')}
$('grid').addEventListener('click',e=>{const t=e.target.closest('.tg');if(t)openDet(t.dataset.sid)});
$('dX').addEventListener('click',closeDet);
setInterval(()=>{if(OPEN)drawDetail()},15000);

/* ---------- start ---------- */
load();setInterval(load,CFG.poll*1000);setInterval(tickTimers,1000);
window.addEventListener('resize',()=>{SIG='';draw()});
window.addEventListener('online',load);
</script>
</body>
</html>
